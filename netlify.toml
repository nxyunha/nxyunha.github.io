# Netlify 배포 설정
# 공개 폴더(public)만 배포하고, 서버 함수는 netlify/functions 에서 실행한다.

[build]
  # 빌드 도구 없는 정적 사이트이므로 빌드 명령은 없다.
  publish = "public"
  functions = "netlify/functions"

# 브라우저가 깔끔한 경로(/api/guestbook)로 서버 함수를 호출하도록 연결한다.
[[redirects]]
  from = "/api/guestbook"
  to = "/.netlify/functions/guestbook"
  status = 200

# 참고: 서버 전용 키(SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY)는
# 이 파일이나 공개 코드에 적지 않고 Netlify 대시보드의
# Environment variables 에 등록한다. 브라우저에는 키가 노출되지 않는다.
